name: CICD

# Pull requests run tests and blocking scans. Scan-only local containers are
# built where needed; release images and staging promotions run only on main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Serialize main releases/promotions so tag creation and staging updates stay ordered.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.22.1"
  SVC_NAME: frontend
  SVC_FILE: 10-frontend-deployment.yaml
  ROUTER: frontend
  TAG_PREFIX: FRONTEND

jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Only shipped code or Docker inputs create a version and image.
    # Tests, docs, GitHub configuration and CI-only settings are excluded.
    outputs:
      version: ${{ steps.version.outputs.version }}
      code_changed: ${{ steps.changes.outputs.code }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check for shipped or Docker input changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Compare the prior main tip with the pushed main tip. This covers
          # the resulting tree of merge commits, including merge resolutions.
          base="$BASE_SHA"
          head="$HEAD_SHA"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "Initial main push -- treating all files as changed."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --quiet origin "$base" "$head" || {
            echo "ERROR: could not fetch the before/after commits; refusing to guess."
            exit 1
          }
          files=$(git diff --name-only "$base" "$head") || {
            echo "ERROR: cannot diff $base against $head; refusing to guess."
            exit 1
          }
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              test/*|tests/*|*/test/*|*/tests/*|__tests__/*|*/__tests__/*|*.test.*|*.spec.*|*.md|*.rst|*.adoc|docs/*|*/docs/*|.github/*|.gitignore|.trivyignore|.editorconfig|.prettier*|.eslint*|eslint.config.*|prettier.config.*|.markdownlint*|.yamllint*|.shellcheckrc|.hadolint.yaml|jest.config.*|vitest.config.*) ;;
              *) code=true; break ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Shipped or Docker input changed: $code"

      - name: Read version and create tag
        id: version
        run: |
          major=$(jq -r '.major' VERSION.json)
          minor=$(jq -r '.minor' VERSION.json)

          latest=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          if [ "${{ steps.changes.outputs.code }}" = "true" ]; then
            current_patch=$(echo "$latest" | cut -d. -f3)
            new_patch=${current_patch:-0}
            new_patch=$((new_patch + 1))

            new_version="v${major}.${minor}.${new_patch}"
            echo "version=$new_version" >> $GITHUB_OUTPUT
            echo "New version: $new_version"
          else
            echo "version=v$latest" >> $GITHUB_OUTPUT
            echo "CI-only change -- reusing latest tag v$latest, no new version."
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: steps.changes.outputs.code == 'true'
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}


  docker:
    needs: version
    # No new version, no new image: docs/infra-only merges end in the
    # `version` job above (green, but without tag or image).
    if: needs.version.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.version }}
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{ version }},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{ major }}.{{ minor }}
            type=semver,pattern={{ major }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sast-semgrep:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    name: SAST / Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Semgrep scan (blocking)
        # Runs the official Docker image instead of a pip venv: the pip
        # `semgrep-core` binary segfaulted (SIGSEGV, exit -11/139) mid-scan on
        # the Astrology and Booking repos, killing the job. The image ships a
        # matching, prebuilt semgrep-core for the pinned version, so the scan
        # no longer depends on a runner-built binary.
        # Explicit ruleset `p/default`: `--config auto` refuses to run with
        # metrics off, and metrics stay off here. `--error` makes any finding
        # exit non-zero, which fails the job on purpose. `--jobs 1` keeps the
        # scan single-threaded (parallel workers added flakiness). Still
        # blocking: no continue-on-error, so a finding or a scan failure fails
        # the job.
        run: |
          docker run --rm \
            -e SEMGREP_SEND_METRICS=off \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:1.182.0 \
            semgrep scan --config p/default --error --jobs 1 --sarif --output semgrep.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─────────────────────────────────────────────────────────────────────────
  # 1b. STATIC — Software Composition Analysis (dependencies, secrets, IaC)
  # ─────────────────────────────────────────────────────────────────────────

  sca:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    name: SCA / npm audit + Trivy repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm audit (blocking, moderate and above)
        # Blocks the job on any moderate/high/critical advisory. The report
        # step below still runs with `if: always()` when this one fails.
        run: npm audit --audit-level=moderate

      - name: npm audit report (always)
        if: always()
        run: npm audit --audit-level=moderate --json > npm-audit.json || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30

      - name: Trivy repo scan — vuln, secrets, misconfig (blocking)
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0, SHA-pinned (supply-chain safety)
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: 'true'
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"

      - name: Upload Trivy repo SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ─────────────────────────────────────────────────────────────────────────
  # 2. DOCKER — build the production image, scan it with Trivy
  # ─────────────────────────────────────────────────────────────────────────

  docker-scan:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    name: Docker / Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (local only, no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: frontend:security-scan

      - name: Trivy image scan (blocking)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0, SHA-pinned (supply-chain safety)
        with:
          version: v0.76.1
          scan-type: image
          image-ref: frontend:security-scan
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: 'true'
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"

      - name: Upload Trivy image SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ─────────────────────────────────────────────────────────────────────────
  # 3. DYNAMIC — boot the production nginx image, run OWASP ZAP baseline
  #
  # The frontend is a static Vite build served by nginx; the entrypoint only
  # substitutes __PLACEHOLDERS__ in env.js/index.html, so dummy (non-secret)
  # values are enough for a baseline crawl of: GET /, GET /health,
  # SPA fallback (/index.html), 404 handling. No Express "/" route exists
  # here by design — "/" is served by nginx try_files.
  # ─────────────────────────────────────────────────────────────────────────

  dast-zap:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    name: DAST / OWASP ZAP baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_ENV: development
      FRONTEND_SERVER_PORT: "3103"
      # Dummy frontend values — only placeholder substitution; no secret use.
      FRONTEND_SENTRY_DSN: https://00000000000000000000000000000000@o0.ingest.sentry.io/0
      STRIPE_PK: pk_test_dummy_key_for_ci_scan_only
      R2_BASE_URL: https://ci.local
      ASTROLOGY_API_SERVER_DC_PORT: "3101"
      ASTROLOGY_API_SERVER_DC_DNS: ci.local
      ASTROLOGY_API_SERVER_K8S_PORT: "3101"
      ASTROLOGY_API_SERVER_K8S_DNS: ci.local
      BOOKING_API_SERVER_DC_PORT: "3102"
      BOOKING_API_SERVER_DC_DNS: ci.local
      BOOKING_API_SERVER_K8S_PORT: "3102"
      BOOKING_API_SERVER_K8S_DNS: ci.local
      PAYMENT_API_SERVER_DC_PORT: "3000"
      PAYMENT_API_SERVER_DC_DNS: ci.local
      PAYMENT_API_SERVER_K8S_PORT: "3000"
      PAYMENT_API_SERVER_K8S_DNS: ci.local
      FRONTEND_SERVER_DC_PORT: "3103"
      FRONTEND_SERVER_DC_DNS: ci.local
      FRONTEND_SERVER_K8S_PORT: "3103"
      FRONTEND_SERVER_K8S_DNS: ci.local
      ASTROLOGY_API_URL: https://ci.local
      PAYMENT_API_URL: https://ci.local
      BOOKING_API_URL: https://ci.local
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (local only, no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: frontend:security-scan

      - name: Start frontend and wait for health
        run: |
          docker run -d --name frontend-scan \
            -p "${FRONTEND_SERVER_PORT}:8080" \
            -e NODE_ENV="${NODE_ENV}" \
            -e FRONTEND_SERVER_PORT="${FRONTEND_SERVER_PORT}" \
            -e FRONTEND_SENTRY_DSN="${FRONTEND_SENTRY_DSN}" \
            -e STRIPE_PK="${STRIPE_PK}" \
            -e R2_BASE_URL="${R2_BASE_URL}" \
            -e ASTROLOGY_API_SERVER_DC_PORT="${ASTROLOGY_API_SERVER_DC_PORT}" \
            -e ASTROLOGY_API_SERVER_DC_DNS="${ASTROLOGY_API_SERVER_DC_DNS}" \
            -e ASTROLOGY_API_SERVER_K8S_PORT="${ASTROLOGY_API_SERVER_K8S_PORT}" \
            -e ASTROLOGY_API_SERVER_K8S_DNS="${ASTROLOGY_API_SERVER_K8S_DNS}" \
            -e BOOKING_API_SERVER_DC_PORT="${BOOKING_API_SERVER_DC_PORT}" \
            -e BOOKING_API_SERVER_DC_DNS="${BOOKING_API_SERVER_DC_DNS}" \
            -e BOOKING_API_SERVER_K8S_PORT="${BOOKING_API_SERVER_K8S_PORT}" \
            -e BOOKING_API_SERVER_K8S_DNS="${BOOKING_API_SERVER_K8S_DNS}" \
            -e PAYMENT_API_SERVER_DC_PORT="${PAYMENT_API_SERVER_DC_PORT}" \
            -e PAYMENT_API_SERVER_DC_DNS="${PAYMENT_API_SERVER_DC_DNS}" \
            -e PAYMENT_API_SERVER_K8S_PORT="${PAYMENT_API_SERVER_K8S_PORT}" \
            -e PAYMENT_API_SERVER_K8S_DNS="${PAYMENT_API_SERVER_K8S_DNS}" \
            -e FRONTEND_SERVER_DC_PORT="${FRONTEND_SERVER_DC_PORT}" \
            -e FRONTEND_SERVER_DC_DNS="${FRONTEND_SERVER_DC_DNS}" \
            -e FRONTEND_SERVER_K8S_PORT="${FRONTEND_SERVER_K8S_PORT}" \
            -e FRONTEND_SERVER_K8S_DNS="${FRONTEND_SERVER_K8S_DNS}" \
            -e ASTROLOGY_API_URL="${ASTROLOGY_API_URL}" \
            -e PAYMENT_API_URL="${PAYMENT_API_URL}" \
            -e BOOKING_API_URL="${BOOKING_API_URL}" \
            frontend:security-scan
          for i in $(seq 1 30); do
            if curl -fs "http://localhost:${FRONTEND_SERVER_PORT}/health" > /dev/null; then
              echo "Frontend is up on port ${FRONTEND_SERVER_PORT}"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start — logs:"
          docker logs frontend-scan
          exit 1

      - name: OWASP ZAP baseline scan (blocking on FAIL alerts)
        # -I keeps WARN/PASS alerts in the report but only FAIL-level alerts
        # fail the scan, so baseline warnings stay actionable without blocking
        # every build. No continue-on-error: a failing scan fails the job.
        # --network host lets the ZAP container reach nginx on localhost.
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -I \
              -t "http://localhost:${FRONTEND_SERVER_PORT}" \
              -r baseline-report.html \
              -J baseline-report.json

      - name: Stop frontend
        if: always()
        run: docker rm -f frontend-scan 2>/dev/null || true

      - name: Upload ZAP reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-baseline-reports
          path: zap-reports/
          retention-days: 30

  unit-tests:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  promote-kubernetes:
    # Reads the live color from the *-live Service (parsed as YAML), bumps
    # the image on the idle Deployment, flips the selector. Staging only.
    needs: [version, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Kubernetes repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AstroLumina-Rise-n-Shine/AstroLumina-Kubernetes
          token: ${{ secrets.GITOPS_PAT }}
          fetch-depth: 0

      - name: Ensure PyYAML is available
        # ubuntu-latest runners already ship PyYAML, so this is a no-op
        # guard; the install branch only runs on images without it.
        run: python3 -c "import yaml" 2>/dev/null || python3 -m pip install --break-system-packages pyyaml


      - name: Bump idle color and flip live (staging)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          import sys

          import yaml

          svc = os.environ["SVC_NAME"]
          svc_file = os.environ["SVC_FILE"]
          new_tag = os.environ["VERSION"].lstrip("v")
          parts = new_tag.split(".")
          if len(parts) != 3 or not all(p.isdigit() for p in parts):
              sys.exit(f"ERROR: unexpected version tag {new_tag!r}")
          # --- 1. Read the live color from the *-live Service ---
          live_path = "staging/53-live-services.yaml"
          raw = open(live_path).read()
          docs = [d for d in yaml.safe_load_all(raw) if d]
          live_doc = next(
              (
                  d
                  for d in docs
                  if d.get("kind") == "Service" and d.get("metadata", {}).get("name") == f"{svc}-live"
              ),
              None,
          )
          if live_doc is None:
              sys.exit(f"ERROR: live Service for {svc} not found in {live_path}")
          live = live_doc["spec"]["selector"]["variant"]
          if live not in ("blue", "green"):
              sys.exit(f"ERROR: unexpected live color {live!r}")
          idle = "green" if live == "blue" else "blue"

          # --- 2. Flip the selector (single anchored line inside this Service's doc) ---
          segment = next(s for s in re.split(r"(?m)^---[ \t]*$", raw) if f"name: {svc}-live" in s)
          seg_new, n = re.subn(rf"^([ \t]*variant: ){live}\b", rf"\g<1>{idle}", segment, flags=re.M)
          if n != 1:
              sys.exit(f"ERROR: expected 1 variant line for {svc}-live, found {n}")
          open(live_path, "w").write(raw.replace(segment, seg_new, 1))

          # --- 3. Bump the image tag of the `frontend` container only ---
          # The Deployment is NOT single-container: next to the app container
          # it runs the `nginx-metrics` Prometheus exporter sidecar, and it
          # seeds the shared html volume from an `init-frontend-html` init
          # container. Only the app container may be re-tagged; the sidecar
          # and the init container keep their own pinned images. (The old
          # single-container check rejected this layout, and a relaxed global
          # `image:` regex would have retagged the sidecar/init container.)
          dep_path = f"staging/{idle}/{svc_file}"
          with open(dep_path, "rb") as f:
              dep_bytes = f.read()
          try:
              dep_txt = dep_bytes.decode("utf-8")
          except UnicodeDecodeError:
              sys.exit(f"ERROR: {dep_path} is not valid UTF-8")
          dep = yaml.safe_load(dep_txt)
          if dep["spec"]["template"]["metadata"]["labels"].get("variant") != idle:
              sys.exit(f"ERROR: {dep_path} does not look like the {idle} variant")
          containers = dep["spec"]["template"]["spec"].get("containers") or []
          if not containers:
              sys.exit(f"ERROR: no containers in {dep_path}")
          names = [c.get("name") for c in containers]
          matches = [c for c in containers if c.get("name") == svc]
          if len(matches) != 1:
              sys.exit(
                  f"ERROR: expected exactly 1 container named {svc!r} in {dep_path},"
                  f" found {len(matches)} (containers: {names})"
              )
          old_image = matches[0].get("image")
          if not isinstance(old_image, str) or not old_image:
              sys.exit(f"ERROR: container {svc!r} in {dep_path} has no image")
          # Only the tag is replaced: registry and repository are preserved.
          # The tag separator must be a ':' in the LAST path segment, so a
          # registry port (registry:5000/img) is not mistaken for a tag, and a
          # digest-pinned image (img@sha256:...) fails instead of being
          # silently retagged into an invalid reference.
          last_seg = old_image.rsplit("/", 1)[-1]
          if "@" in old_image or ":" not in last_seg:
              sys.exit(f"ERROR: image {old_image!r} in {dep_path} has no tag separator")
          new_image = f"{old_image.rsplit(':', 1)[0]}:{new_tag}"

          # Edit the raw text instead of re-dumping YAML: comments, key order,
          # indentation and CRLF/LF line endings must survive the bump.
          def _split_eol(line):
              body = line.rstrip("\r\n")
              return body, line[len(body):]

          lines = dep_txt.splitlines(keepends=True)
          img_idx = None
          for i, line in enumerate(lines):
              body, _ = _split_eol(line)
              m = re.match(
                  r"^([ \t]*)-[ \t]+name:[ \t]*['\"]?" + re.escape(svc) + r"['\"]?[ \t]*(?:#.*)?$",
                  body,
              )
              if not m:
                  continue
              item_indent = len(m.group(1))
              key_indent = None
              for j in range(i + 1, len(lines)):
                  sub, _ = _split_eol(lines[j])
                  if not sub.strip() or sub.lstrip().startswith("#"):
                      continue
                  ind = len(sub) - len(sub.lstrip(" "))
                  is_item = sub.lstrip(" ").startswith("- ")
                  if key_indent is None:
                      key_indent = ind
                  if is_item and ind <= item_indent:
                      break  # next container in the list
                  if not is_item and ind < key_indent:
                      break  # left this container's mapping
                  mi = re.match(
                      r"^[ \t]*image:[ \t]+(\"[^\"]*\"|'[^']*'|\S+)[ \t]*(?:#.*)?$", sub
                  )
                  if mi and ind == key_indent:
                      val = mi.group(1)
                      if val[0] in "\"'" and val[-1] == val[0]:
                          val = val[1:-1]
                      if val != old_image:
                          sys.exit(
                              f"ERROR: image line of {svc!r} in {dep_path} does not match"
                              f" the parsed image {old_image!r}"
                          )
                      img_idx = j
                      break
              if img_idx is not None:
                  break
          if img_idx is None:
              sys.exit(f"ERROR: no image line found for container {svc!r} in {dep_path}")

          body, eol = _split_eol(lines[img_idx])
          m = re.match(r"^([ \t]*image:[ \t]+)(\"[^\"]*\"|'[^']*'|\S+)([ \t]*(?:#.*)?)$", body)
          if not m:
              sys.exit(f"ERROR: cannot rewrite image line {img_idx + 1} in {dep_path}")
          raw_val = m.group(2)
          quote = raw_val[0] if raw_val[0] in "\"'" else ""
          lines[img_idx] = f"{m.group(1)}{quote}{new_image}{quote}{m.group(3)}{eol}"

          # Exactly one line may change -- guards against a too-broad match.
          orig_lines = dep_txt.splitlines(keepends=True)
          changed = [k for k, (a, b) in enumerate(zip(orig_lines, lines)) if a != b]
          if len(orig_lines) != len(lines) or changed != [img_idx]:
              sys.exit(f"ERROR: expected exactly 1 changed line in {dep_path}, got {changed}")
          with open(dep_path, "wb") as f:
              f.write("".join(lines).encode("utf-8"))

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"IDLE_COLOR={idle}\nNEW_TAG={new_tag}\n")
          print(f"Promoting {svc} to {new_tag} on {idle} (was live: {live})")
          PYEOF

      - name: Commit to branch and open promotion PR (Kubernetes update repo)
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="promote/${{ env.SVC_NAME }}-${{ env.NEW_TAG }}"
          # -B resets a stale branch left by an earlier failed run. The
          # promote/* namespace is bot-owned, so the force-push below only
          # ever overwrites the bot's own previous attempt, never human work.
          git checkout -B "$BRANCH"
          git add "staging/${{ env.IDLE_COLOR }}/${{ env.SVC_FILE }}" staging/53-live-services.yaml
          if git diff --cached --quiet; then
            echo "Kubernetes update repo: nothing to commit"
          else
            git commit -m "staging: promote ${{ env.SVC_NAME }} to ${{ env.NEW_TAG }} on ${{ env.IDLE_COLOR }} and flip live"
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "Kubernetes update repo: no changes vs main, skipping PR"
          else
            git push -u -f origin "$BRANCH"
            if gh pr view "$BRANCH" --json number -q .number >/dev/null 2>&1; then
              echo "Kubernetes update repo: PR already exists for $BRANCH, pushed update to it"
            else
              gh pr create --base main --head "$BRANCH" \
                --title "staging: promote ${{ env.SVC_NAME }} to ${{ env.NEW_TAG }} on ${{ env.IDLE_COLOR }}" \
                --body "Automated staging promotion of ${{ env.SVC_NAME }} to ${{ env.NEW_TAG }} (idle color ${{ env.IDLE_COLOR }}, live flipped). Merge to deploy to staging."
            fi
          fi

  promote-helm:
    # Reads this service's live color from blueGreen.liveColors in
    # values-staging.yaml (parsed as YAML), bumps the idle color tag for
    # this service only, flips only its live color. Staging only.
    needs: [version, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Helm repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AstroLumina-Rise-n-Shine/AstroLumina-Helm
          token: ${{ secrets.GITOPS_PAT }}
          fetch-depth: 0

      - name: Ensure PyYAML is available
        # ubuntu-latest runners already ship PyYAML, so this is a no-op
        # guard; the install branch only runs on images without it.
        run: python3 -c "import yaml" 2>/dev/null || python3 -m pip install --break-system-packages pyyaml


      - name: Bump idle color and flip live (staging)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          import sys

          import yaml

          svc = os.environ["SVC_NAME"]
          svc_file = os.environ["SVC_FILE"]
          new_tag = os.environ["VERSION"].lstrip("v")
          parts = new_tag.split(".")
          if len(parts) != 3 or not all(p.isdigit() for p in parts):
              sys.exit(f"ERROR: unexpected version tag {new_tag!r}")
          # --- 1. Read this service's live color and flip only its line ---
          helm_path = "charts/astrolumina/values-staging.yaml"
          helm_txt = open(helm_path).read()
          vals = yaml.safe_load(helm_txt)
          live_map = vals["blueGreen"].get("liveColors")
          if not isinstance(live_map, dict) or svc not in live_map:
              sys.exit(f"ERROR: blueGreen.liveColors.{svc} not found")
          live = live_map[svc]
          if live not in ("blue", "green"):
              sys.exit(f"ERROR: unexpected live color {live!r} for {svc}")
          idle = "green" if live == "blue" else "blue"
          # Flip only this service's line inside the liveColors map, keeping
          # its trailing comment. Scoped by section walk so other maps
          # (imageTags lines carry versions, never bare colors) stay intact.
          hlines = helm_txt.splitlines(keepends=True)
          sec = next(i for i, l in enumerate(hlines) if l == "  liveColors:\n")
          end = next(
              (i for i in range(sec + 1, len(hlines)) if re.match(r"^(?:\S|  \S)", hlines[i])),
              len(hlines),
          )
          tgt = next(
              (i for i in range(sec + 1, end) if hlines[i].startswith(f"    {svc}: ")),
              None,
          )
          if tgt is None:
              sys.exit(f"ERROR: {svc} key not found under liveColors")
          flipped, n = re.subn(f"^    {svc}: {live}\\b(.*)$", f"    {svc}: {idle}\\g<1>", hlines[tgt])
          if n != 1:
              sys.exit(f"ERROR: liveColors line mismatch: {hlines[tgt]!r}")
          hlines[tgt] = flipped
          helm_new = "".join(hlines)

          # --- 2. Bump the idle-color tag (exact key inside the idle section) ---
          if svc not in vals["imageTags"][idle]:
              sys.exit(f"ERROR: imageTags.{idle}.{svc} not found")
          hlines = helm_new.splitlines(keepends=True)
          sec = next(i for i, l in enumerate(hlines) if l == f"  {idle}:\n")
          end = next(
              (i for i in range(sec + 1, len(hlines)) if re.match(r"^(?:\S|  \S)", hlines[i])),
              len(hlines),
          )
          tgt = next(
              (i for i in range(sec + 1, end) if hlines[i].startswith(f"    {svc}: ")),
              None,
          )
          if tgt is None:
              sys.exit(f"ERROR: {svc} key not found under imageTags.{idle}")
          hlines[tgt] = f"    {svc}: {new_tag}\n"
          open(helm_path, "w").write("".join(hlines))

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"IDLE_COLOR={idle}\nNEW_TAG={new_tag}\n")
          print(f"Promoting {svc} to {new_tag} on {idle} (was live: {live})")
          PYEOF

      - name: Commit to branch and open promotion PR (Helm update repo)
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="promote/${{ env.SVC_NAME }}-${{ env.NEW_TAG }}"
          # -B resets a stale branch left by an earlier failed run. The
          # promote/* namespace is bot-owned, so the force-push below only
          # ever overwrites the bot's own previous attempt, never human work.
          git checkout -B "$BRANCH"
          git add charts/astrolumina/values-staging.yaml
          if git diff --cached --quiet; then
            echo "Helm update repo: nothing to commit"
          else
            git commit -m "staging: promote ${{ env.SVC_NAME }} to ${{ env.NEW_TAG }} on ${{ env.IDLE_COLOR }} and flip live"
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "Helm update repo: no changes vs main, skipping PR"
          else
            git push -u -f origin "$BRANCH"
            if gh pr view "$BRANCH" --json number -q .number >/dev/null 2>&1; then
              echo "Helm update repo: PR already exists for $BRANCH, pushed update to it"
            else
              gh pr create --base main --head "$BRANCH" \
                --title "staging: promote ${{ env.SVC_NAME }} to ${{ env.NEW_TAG }} on ${{ env.IDLE_COLOR }}" \
                --body "Automated staging promotion of ${{ env.SVC_NAME }} to ${{ env.NEW_TAG }} (idle color ${{ env.IDLE_COLOR }}, live flipped). Merge to deploy to staging."
            fi
          fi

  promote-compose:
    # Reads the live color from the app router in routes.yml (parsed as
    # YAML), bumps the idle tag in versions.env, flips the router. Staging
    # only.
    needs: [version, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout DockerCompose repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AstroLumina-Rise-n-Shine/AstroLumina-DockerCompose
          token: ${{ secrets.GITOPS_PAT }}
          fetch-depth: 0

      - name: Ensure PyYAML is available
        # ubuntu-latest runners already ship PyYAML, so this is a no-op
        # guard; the install branch only runs on images without it.
        run: python3 -c "import yaml" 2>/dev/null || python3 -m pip install --break-system-packages pyyaml


      - name: Bump idle color and flip live (staging)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          import sys

          import yaml

          svc = os.environ["SVC_NAME"]
          svc_file = os.environ["SVC_FILE"]
          new_tag = os.environ["VERSION"].lstrip("v")
          parts = new_tag.split(".")
          if len(parts) != 3 or not all(p.isdigit() for p in parts):
              sys.exit(f"ERROR: unexpected version tag {new_tag!r}")
          router = os.environ["ROUTER"]
          tag_prefix = os.environ["TAG_PREFIX"]

          # --- 1. Read the live color from the app router ---
          routes_path = "staging/traefik/dynamic/routes.yml"
          routes_txt = open(routes_path).read()
          routers = yaml.safe_load(routes_txt)["http"]["routers"]
          match = next(
              (
                  (name, r["service"])
                  for name, r in routers.items()
                  if r.get("service", "").startswith(f"{router}-")
              ),
              None,
          )
          if match is None:
              sys.exit(f"ERROR: no router service for {router} in {routes_path}")
          live = match[1].rsplit("-", 1)[1]
          if live not in ("blue", "green"):
              sys.exit(f"ERROR: unexpected live color {live!r}")
          idle = "green" if live == "blue" else "blue"
          routes_new, n = re.subn(
              rf"^([ \t]*service: ){router}-{live}\b", rf"\g<1>{router}-{idle}", routes_txt, flags=re.M
          )
          if n != 1:
              sys.exit(f"ERROR: expected 1 service line for router {router}, found {n}")
          open(routes_path, "w").write(routes_new)

          # --- 2. Bump the idle-color tag in versions.env (plain KEY= file, not YAML) ---
          venv_path = "staging/versions.env"
          key = f"{tag_prefix}_{idle.upper()}_DOCKER_IMAGE_TAG="
          vlines = open(venv_path).read().splitlines(keepends=True)
          hit = next((i for i, l in enumerate(vlines) if l.startswith(key)), None)
          if hit is None:
              sys.exit(f"ERROR: {key} not found in {venv_path}")
          vlines[hit] = f"{key}{new_tag}\n"
          open(venv_path, "w").write("".join(vlines))

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"IDLE_COLOR={idle}\nNEW_TAG={new_tag}\n")
          print(f"Promoting {svc} to {new_tag} on {idle} (was live: {live})")
          PYEOF

      - name: Commit to branch and open promotion PR (DockerCompose update repo)
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="promote/${{ env.SVC_NAME }}-${{ env.NEW_TAG }}"
          # -B resets a stale branch left by an earlier failed run. The
          # promote/* namespace is bot-owned, so the force-push below only
          # ever overwrites the bot's own previous attempt, never human work.
          git checkout -B "$BRANCH"
          git add staging/versions.env staging/traefik/dynamic/routes.yml
          if git diff --cached --quiet; then
            echo "DockerCompose update repo: nothing to commit"
          else
            git commit -m "staging: promote ${{ env.SVC_NAME }} to ${{ env.NEW_TAG }} on ${{ env.IDLE_COLOR }} and flip live"
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "DockerCompose update repo: no changes vs main, skipping PR"
          else
            git push -u -f origin "$BRANCH"
            if gh pr view "$BRANCH" --json number -q .number >/dev/null 2>&1; then
              echo "DockerCompose update repo: PR already exists for $BRANCH, pushed update to it"
            else
              gh pr create --base main --head "$BRANCH" \
                --title "staging: promote ${{ env.SVC_NAME }} to ${{ env.NEW_TAG }} on ${{ env.IDLE_COLOR }}" \
                --body "Automated staging promotion of ${{ env.SVC_NAME }} to ${{ env.NEW_TAG }} (idle color ${{ env.IDLE_COLOR }}, live flipped). Merge to deploy to staging."
            fi
          fi
