name: Sentry Diagnose

on:
  pull_request:
    paths:
      - '.github/workflows/sentry-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: sentry-cli auth and project resolution
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_ORG_TOKEN }}
        run: |
          set +e
          echo "=== info ==="
          npx --yes @sentry/cli@2 info 2>&1 | sed -E 's/(sntrys_|sentry_)[A-Za-z0-9_]+/<redacted>/g' | tail -30
          echo "=== projects list (token org) ==="
          npx --yes @sentry/cli@2 projects list --log-level=debug 2>&1 | sed -E 's/(sntrys_|sentry_)[A-Za-z0-9_]+/<redacted>/g' | tail -30
          echo "=== releases new against astrolumina-frontend ==="
          npx --yes @sentry/cli@2 releases new v0.0.0-diagnostic -p astrolumina-frontend --log-level=debug 2>&1 | sed -E 's/(sntrys_|sentry_)[A-Za-z0-9_]+/<redacted>/g' | tail -40
