name: Sentry Diagnose

on:
  pull_request:
    paths:
      - '.github/workflows/sentry-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the organization bound to SENTRY_ORG_TOKEN
        env:
          TOKEN: ${{ secrets.SENTRY_ORG_TOKEN }}
        run: |
          API="https://sentry.io/api/0"
          for p in astrolumina-frontend astrolumina-astrology-api astrolumina-booking-api astrolumina-payments-api frontend astrology-api booking-api payment-api; do
            code=$(curl -s -o /tmp/p.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$API/projects/pirvudanielcatalin/$p/")
            echo "project:$p -> HTTP $code"
            if [ "$code" = "200" ]; then jq -r '"  slug=\(.slug) id=\(.id) platform=\(.platform)"' /tmp/p.json; fi
          done
          echo "--- projects listed for the org ---"
          code=$(curl -s -o /tmp/list.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$API/organizations/pirvudanielcatalin/projects/?per_page=100")
          echo "org projects -> HTTP $code"
          jq -r '.[]? | "\(.slug) | \(.name)"' /tmp/list.json 2>/dev/null || head -c 300 /tmp/list.json
          echo "--- org teams ---"
          curl -s -H "Authorization: Bearer $TOKEN" "$API/organizations/pirvudanielcatalin/teams/?per_page=100" | jq -r '.[]? | "\(.slug)"' 2>/dev/null || true
