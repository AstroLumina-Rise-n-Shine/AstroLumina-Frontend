name = "astrolumina"
compatibility_flags = ["nodejs_compat"]

[build]
  command = "npm run build:cloudflare"
  cwd = "."

[build.environment]
  NODE_VERSION = "24.22.1"

[[pages_build]]
  directory = "dist"

[env.production]
  name = "Astrolumina"

[env.production.build]
  command = "npm run build:cloudflare"
