# Shared security headers for the AstroLumina frontend server.
# Included at server level and in every location that sets its own
# add_header: a location-level add_header REPLACES (not merges) the inherited
# ones, so without this include those responses would ship with no security
# headers at all. Single source of truth -- editing here updates all routes.
#
# The Content-Security-Policy mirrors the meta tag in index.html directive for
# directive, source for source. The __PLACEHOLDER__ tokens are substituted at
# container start by docker-entrypoint.sh (the file is shipped to the writable
# /var/cache/nginx/security-headers.conf path), exactly like the placeholders
# in index.html, so the header and the meta tag always describe the same
# origins for the current deployment. Keep both files in sync.
#
# X-XSS-Protection is explicitly disabled: the legacy reflected-XSS auditor is
# not implemented by modern browsers and its filter mode introduced XSS
# vectors of its own. The CSP is the XSS control here.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# same-origin-allow-popups rather than plain same-origin: payments run through
# Revolut Pay widget, whose payment-method/3-D Secure flows can open a
# popup that needs window.opener. The document is still isolated from
# cross-origin openers, only outbound popups keep their opener.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
