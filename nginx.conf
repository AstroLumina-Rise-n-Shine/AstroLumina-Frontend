# ==========================================================
# nginx.conf - AstroLumina Frontend
# ==========================================================

# Non-root runtime (Docker USER nginx) cannot write the default pid file
# under /run, so keep it on the writable /tmp instead.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ───────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ─── Performance ───────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    # ─── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/rss+xml
               application/atom+xml image/svg+xml;

    # ==========================================================
    # Server
    # ==========================================================
    server {
        listen 8080;
        # IPv6 twin: inside the container `localhost` often resolves to ::1
        # first, so without this the local healthchecks would refuse to
        # connect half the time.
        listen [::]:8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ─── Security Headers ─────────────────────────────────────────────
        # Single include (see nginx-security-headers.conf) instead of four
        # repeated add_header lines: repetition trips header-redefinition
        # scanners, while the include keeps one source of truth.
        include /etc/nginx/security-headers.conf;

        # ─── Cache Static Assets ──────────────────────────────────────────
        # The negative lookahead excludes /env.js: without it that file would
        # also match here and gain a 1-year immutable cache (plus a duplicate
        # Cache-Control), which is wrong for runtime config.
        location ~* ^/(?!env\.js$).+\.(js|css|png|jpg|jpeg|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        # ─── No Cache HTML ────────────────────────────────────────────────
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
        }

        # ─── No Cache env.js (runtime config) ───────────────────────────────
        location /env.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            include /etc/nginx/security-headers.conf;
        }

        # ==========================================================
        # SPA Fallback - React Router
        # ==========================================================
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─── Health Check ─────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "OK";
            include /etc/nginx/security-headers.conf;
        }
    }
}