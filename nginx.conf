# ==========================================================
# nginx.conf - AstroLumina Frontend
# ==========================================================

# Non-root runtime (Docker USER nginx) cannot write the default pid file
# under /run, so keep it on the writable /tmp instead.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Hardening ─────────────────────────────────────────────────────────
    # Never advertise the nginx version in responses or error pages.
    server_tokens off;
    # The site is a static SPA: no request body is ever uploaded. A 1m cap
    # keeps oversized POSTs from being buffered by the server at all.
    client_max_body_size 1m;

    # ─── Logging ───────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ─── Performance ───────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    # ─── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/rss+xml
               application/atom+xml image/svg+xml;

    # ==========================================================
    # Server
    # ==========================================================
    server {
        listen 8080;
        # IPv6 twin: inside the container `localhost` often resolves to ::1
        # first, so without this the local healthchecks would refuse to
        # connect half the time.
        listen [::]:8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ─── Security Headers ─────────────────────────────────────────────
        # Single include (see nginx-security-headers.conf) instead of four
        # repeated add_header lines: repetition trips header-redefinition
        # scanners, while the include keeps one source of truth.
        # The included copy lives in /var/cache/nginx so the unprivileged
        # nginx user can rewrite the CSP placeholders at container start
        # (docker-entrypoint.sh), keeping the header identical to the
        # index.html meta CSP for the current deployment.
        include /var/cache/nginx/security-headers.conf;

        # ─── Cache Static Assets ──────────────────────────────────────────
        # The negative lookahead excludes /env.js: without it that file would
        # also match here and gain a 1-year immutable cache (plus a duplicate
        # Cache-Control), which is wrong for runtime config.
        location ~* ^/(?!env\.js$).+\.(js|css|png|jpg|jpeg|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /var/cache/nginx/security-headers.conf;
        }

        # ─── No Cache HTML ────────────────────────────────────────────────
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
            include /var/cache/nginx/security-headers.conf;
        }

        # ─── No Cache env.js (runtime config) ───────────────────────────────
        location /env.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            include /var/cache/nginx/security-headers.conf;
        }

        # ==========================================================
        # SPA Fallback - React Router
        # ==========================================================
        # Real files win over the fallback, so /robots.txt (shipped from
        # public/) is served as the static file and never as index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─── Health Check ─────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "OK";
            include /var/cache/nginx/security-headers.conf;
        }

        # ─── Nginx Metrics (stub_status) ──────────────────────────────────
        # Localhost-only: the nginx-prometheus-exporter sidecar scrapes
        # 127.0.0.1:8080/stub_status and re-exposes the counters as
        # Prometheus metrics on :9113. Everything else is denied, so the
        # path stays unreachable through the Traefik-facing routes.
        location = /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow ::1;
            deny all;
            access_log off;
        }
    }
}