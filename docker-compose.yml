services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/astrolumina-rise-n-shine/astrolumina-frontend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - FRONTEND_SERVER_PORT=${FRONTEND_SERVER_PORT}
      - FRONTEND_SENTRY_DSN=${FRONTEND_SENTRY_DSN}
      - REVOLUT_PAY_PUBLIC_KEY=${REVOLUT_PAY_PUBLIC_KEY}
      - R2_BASE_URL=${R2_BASE_URL}
      - ASTROLOGY_API_URL=${ASTROLOGY_API_URL}
      - PAYMENT_API_URL=${PAYMENT_API_URL}
      - BOOKING_API_URL=${BOOKING_API_URL}
      - ASTROLOGY_API_SERVER_DC_PORT=${ASTROLOGY_API_SERVER_DC_PORT}
      - ASTROLOGY_API_SERVER_DC_DNS=${ASTROLOGY_API_SERVER_DC_DNS}
      - ASTROLOGY_API_SERVER_K8S_PORT=${ASTROLOGY_API_SERVER_K8S_PORT}
      - ASTROLOGY_API_SERVER_K8S_DNS=${ASTROLOGY_API_SERVER_K8S_DNS}
      - BOOKING_API_SERVER_DC_PORT=${BOOKING_API_SERVER_DC_PORT}
      - BOOKING_API_SERVER_DC_DNS=${BOOKING_API_SERVER_DC_DNS}
      - BOOKING_API_SERVER_K8S_PORT=${BOOKING_API_SERVER_K8S_PORT}
      - BOOKING_API_SERVER_K8S_DNS=${BOOKING_API_SERVER_K8S_DNS}
      - PAYMENT_API_SERVER_DC_PORT=${PAYMENT_API_SERVER_DC_PORT}
      - PAYMENT_API_SERVER_DC_DNS=${PAYMENT_API_SERVER_DC_DNS}
      - PAYMENT_API_SERVER_K8S_PORT=${PAYMENT_API_SERVER_K8S_PORT}
      - PAYMENT_API_SERVER_K8S_DNS=${PAYMENT_API_SERVER_K8S_DNS}
      - FRONTEND_SERVER_DC_PORT=${FRONTEND_SERVER_DC_PORT}
      - FRONTEND_SERVER_DC_DNS=${FRONTEND_SERVER_DC_DNS}
      - FRONTEND_SERVER_K8S_PORT=${FRONTEND_SERVER_K8S_PORT}
      - FRONTEND_SERVER_K8S_DNS=${FRONTEND_SERVER_K8S_DNS}
    ports:
      - "${FRONTEND_SERVER_DC_PORT}:8080"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - frontend

networks:
  frontend:
    name: frontend-network
    driver: bridge
